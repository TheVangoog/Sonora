# Render Blueprint for the Sonora API (server/). The frontend stays on Vercel,
# which forwards /api/* here (vercel.json). SQLite needs a persistent disk;
# Render disks need a paid instance type (without one, data is lost on restart).
services:
  - type: web
    name: sonora-api
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/sonora.db
    disk:
      name: sonora-data
      mountPath: /var/data
      sizeGB: 1
